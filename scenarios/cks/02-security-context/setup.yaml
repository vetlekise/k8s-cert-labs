apiVersion: v1
kind: Namespace
metadata:
  name: sec-ctx
  labels:
    scenario: "02"
---
# This Deployment runs with two prominent security-context problems:
#   * the container runs as root (runAsUser: 0), overriding the pod-level 1000
#   * the container is privileged
# Your task (questions/cks.md #2) is to fix ONLY those two fields. Use the
# unprivileged user id 5487 where an unprivileged user is required. Do not add
# or remove any other fields.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-context-demo
  namespace: sec-ctx
  labels:
    scenario: "02"
    app: sec-ctx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sec-ctx-demo
  template:
    metadata:
      labels:
        app: sec-ctx-demo
        scenario: "02"
    spec:
      securityContext:
        runAsUser: 1000
      containers:
        - name: sec-ctx-demo
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          securityContext:
            runAsUser: 0
            privileged: true
            allowPrivilegeEscalation: false
