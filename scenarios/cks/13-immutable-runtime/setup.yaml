apiVersion: v1
kind: Namespace
metadata:
  name: runtime
  labels:
    scenario: "13"
---
# This Deployment's container is mutable at runtime: it can write to its root
# filesystem, escalate privileges and keeps the full default capability set.
# Your task (questions/cks.md #13) is to harden it so the container is immutable
# at runtime and runs with least privilege.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: runtime
  labels:
    scenario: "13"
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        scenario: "13"
    spec:
      containers:
        - name: payment
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
