apiVersion: v1
kind: Namespace
metadata:
  name: cpu-stress
  labels:
    scenario: "11"
---
# Several pods with DIFFERENT CPU usage so `kubectl top` can rank them.
apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog-high
  namespace: cpu-stress
  labels:
    scenario: "11"
    app: cpu-hog
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests:
          cpu: "100m"
        limits:
          cpu: "1000m"
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog-mid
  namespace: cpu-stress
  labels:
    scenario: "11"
    app: cpu-hog
spec:
  containers:
    - name: burn
      image: busybox:1.36
      command: ["sh", "-c", "while true; do :; sleep 0.001; done"]
      resources:
        requests:
          cpu: "50m"
        limits:
          cpu: "300m"
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-hog-low
  namespace: cpu-stress
  labels:
    scenario: "11"
    app: cpu-hog
spec:
  containers:
    - name: idle
      image: busybox:1.36
      command: ["sleep", "3600"]
