apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    scenario: "18"
---
# Backend workload the Ingress will route to. Your task is only to create the
# Ingress `hello-ingress` (host hello.example.com, path / Prefix -> hello-svc:80).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: frontend
  labels:
    scenario: "18"
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
        scenario: "18"
    spec:
      containers:
        - name: hello
          image: nginx:1.25
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-svc
  namespace: frontend
  labels:
    scenario: "18"
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 80
# NOTE: the kind cluster has no Ingress controller installed, so the Ingress
# object won't actually serve traffic; creating it correctly is the exercise.
