apiVersion: v1
kind: Namespace
metadata:
  name: kdsn00201
  labels:
    scenario: "07"
---
# Four pods, each labelled ONLY with app=<pod-name>. Your task: add labels to
# `newpod` so the EXISTING policies let it send to and receive from ONLY the
# `front` and `db` pods, never `dmz`. You may NOT create, modify, or delete
# any NetworkPolicy.
apiVersion: v1
kind: Pod
metadata:
  name: front
  namespace: kdsn00201
  labels:
    scenario: "07"
    app: front
spec:
  containers:
    - name: web
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: kdsn00201
  labels:
    scenario: "07"
    app: db
spec:
  containers:
    - name: web
      image: nginx:1.25
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dmz
  namespace: kdsn00201
  labels:
    scenario: "07"
    app: dmz
spec:
  containers:
    - name: web
      image: nginx:1.25
      ports:
        - containerPort: 80
---
# The pod you must wire up. netshoot ships with curl for the connectivity checks.
apiVersion: v1
kind: Pod
metadata:
  name: newpod
  namespace: kdsn00201
  labels:
    scenario: "07"
    app: newpod
spec:
  containers:
    - name: shell
      image: nicolaka/netshoot
      command: ["sleep", "infinity"]
---
# Baseline: deny all INGRESS to every pod in the namespace. Nothing can be
# reached unless another policy explicitly allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: kdsn00201
  labels:
    scenario: "07"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# `db` accepts traffic only from pods labelled db-access=true (and may reply to them).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-access
  namespace: kdsn00201
  labels:
    scenario: "07"
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              db-access: "true"
  egress:
    - to:
        - podSelector:
            matchLabels:
              db-access: "true"
---
# `front` accepts traffic only from pods labelled front-access=true.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-front-access
  namespace: kdsn00201
  labels:
    scenario: "07"
spec:
  podSelector:
    matchLabels:
      app: front
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              front-access: "true"
  egress:
    - to:
        - podSelector:
            matchLabels:
              front-access: "true"
---
# DECOY: allows everything, but only targets pods labelled app=public
# (nothing has that label). Do not rely on it to solve the task.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-access
  namespace: kdsn00201
  labels:
    scenario: "07"
spec:
  podSelector:
    matchLabels:
      app: public
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
