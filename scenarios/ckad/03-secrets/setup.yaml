apiVersion: v1
kind: Namespace
metadata:
  name: secure
  labels:
    scenario: "03"
---
# Starts with credentials in CLEAR TEXT. Your task is to move them into a
# Secret (keys: username/password/database) and reference them here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: secure
  labels:
    scenario: "03"
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        scenario: "03"
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: DB_USER
              value: admin
            - name: DB_PASSWORD
              value: P@ssw0rd123
            - name: DB_DATABASE
              value: appdb
