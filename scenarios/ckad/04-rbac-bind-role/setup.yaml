apiVersion: v1
kind: Namespace
metadata:
  name: meta
  labels:
    scenario: "04"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-sa
  namespace: meta
  labels:
    scenario: "04"
---
# CORRECT role — grants access to pods (bind this one to dev-sa).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: meta
  labels:
    scenario: "04"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# DECOY role — grants access to configmaps, not pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: meta
  labels:
    scenario: "04"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
# Runs as dev-sa and continuously tries to list pods. With no RoleBinding it
# logs "Forbidden" errors — read them with `kubectl logs deployment/dev-deployment -n meta`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-deployment
  namespace: meta
  labels:
    scenario: "04"
    app: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev
  template:
    metadata:
      labels:
        app: dev
        scenario: "04"
    spec:
      serviceAccountName: dev-sa
      containers:
        - name: dev
          image: docker.io/alpine/k8s:1.30.4
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do kubectl get pods 2>&1; sleep 15; done"
