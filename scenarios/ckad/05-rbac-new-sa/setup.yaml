apiVersion: v1
kind: Namespace
metadata:
  name: audit
  labels:
    scenario: "05"
---
# Runs as the namespace's DEFAULT ServiceAccount, which cannot list pods.
# Your task: create a new SA, a Role (get/list pods), a RoleBinding, and point
# this deployment at the new SA. Confirm the error first with:
#   kubectl logs deployment/reporter-deployment -n audit
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter-deployment
  namespace: audit
  labels:
    scenario: "05"
    app: reporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
        scenario: "05"
    spec:
      containers:
        - name: reporter
          image: bitnami/kubectl:1.30
          command: ["/bin/bash", "-c"]
          args:
            - "while true; do kubectl get pods 2>&1; sleep 15; done"
