apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    scenario: "12"
---
# Hard cap of 10 pods in the namespace. This is why an 80/20 split has to be
# 8 + 2 replicas: you cannot exceed 10 pods total across both deployments.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pod-quota
  namespace: production
  labels:
    scenario: "12"
spec:
  hard:
    pods: "10"
---
# Existing deployment: currently 5 pods sitting behind the NodePort Service.
# Your task: create an IDENTICAL deployment with a DIFFERENT name so that ~20%
# of traffic reaches it. With a 10-pod cap that means scaling this one to 8
# replicas and giving the new deployment 2 replicas (8:2 = 80/20).
#
# The agnhost "netexec" server exposes /hostname, which returns the serving
# pod's name — curl it repeatedly to watch traffic load-balance across both
# deployments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: production
  labels:
    scenario: "12"
    app: webapp
    version: stable
spec:
  replicas: 5
  selector:
    matchLabels:
      app: webapp
      version: stable
  template:
    metadata:
      labels:
        app: webapp
        version: stable
        scenario: "12"
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.47
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
# Existing NodePort Service. Its selector is the SHARED label (app: webapp) only,
# so any pod carrying that label — regardless of which deployment owns it —
# receives traffic. Reachable from the host at http://localhost:30080
# (see the extraPortMappings in kind-cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  namespace: production
  labels:
    scenario: "12"
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
