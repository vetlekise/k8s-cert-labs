apiVersion: v1
kind: Namespace
metadata:
  name: capa-wf-data
  labels:
    scenario: "07"
---
# Executor RBAC so the Workflow's pods can report results back to the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow
  namespace: capa-wf-data
  labels:
    scenario: "07"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: capa-wf-data
  labels:
    scenario: "07"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor
  namespace: capa-wf-data
  labels:
    scenario: "07"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor
subjects:
  - kind: ServiceAccount
    name: workflow
    namespace: capa-wf-data
