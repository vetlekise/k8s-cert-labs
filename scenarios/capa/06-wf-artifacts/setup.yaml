apiVersion: v1
kind: Namespace
metadata:
  name: capa-wf-artifacts
  labels:
    scenario: "06"
---
# Executor RBAC so the Workflow's pods can report results back to the controller.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor
subjects:
  - kind: ServiceAccount
    name: workflow
    namespace: capa-wf-artifacts
---
# A tiny in-namespace MinIO to act as the S3 artifact repository. The Workflow
# you write references it inline (endpoint minio:9000, bucket "argo") using the
# credentials in the Secret below. This keeps artifact passing self-contained.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
type: Opaque
stringData:
  accesskey: admin
  secretkey: password123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        scenario: "06"
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
# Creates the "argo" bucket once MinIO is up so the Workflow has somewhere to
# store artifacts.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-mkbucket
  namespace: capa-wf-artifacts
  labels:
    scenario: "06"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        scenario: "06"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
          command: ["sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$AK" "$SK"; do
                echo waiting for minio; sleep 3;
              done
              mc mb -p local/argo || true
          env:
            - name: AK
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: SK
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
