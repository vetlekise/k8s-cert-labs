apiVersion: v1
kind: Namespace
metadata:
  name: capa-wf
  labels:
    scenario: "01"
---
# A dedicated ServiceAccount for the Workflow's pods. Argo's emissary executor
# needs to create/patch workflowtaskresults, so the SA below is bound to a Role
# granting exactly that. Reference it via `serviceAccountName: workflow`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow
  namespace: capa-wf
  labels:
    scenario: "01"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: capa-wf
  labels:
    scenario: "01"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor
  namespace: capa-wf
  labels:
    scenario: "01"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor
subjects:
  - kind: ServiceAccount
    name: workflow
    namespace: capa-wf
