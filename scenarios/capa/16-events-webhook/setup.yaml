apiVersion: v1
kind: Namespace
metadata:
  name: capa-events
  labels:
    scenario: "16"
---
# The Sensor's pod uses this ServiceAccount to create the trigger resource (a Pod).
# It is bound to a Role granting exactly the pod permissions the trigger needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-sa
  namespace: capa-events
  labels:
    scenario: "16"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: events-trigger
  namespace: capa-events
  labels:
    scenario: "16"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: events-trigger
  namespace: capa-events
  labels:
    scenario: "16"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: events-trigger
subjects:
  - kind: ServiceAccount
    name: events-sa
    namespace: capa-events
