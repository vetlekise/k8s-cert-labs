kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ckad-labs
networking:
  # Disable the default CNI (kindnet) so we can install Calico, which
  # actually enforces NetworkPolicies (kindnet does not).
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
    extraPortMappings:
      # Map a NodePort onto the host so services can be reached at localhost:30080.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
